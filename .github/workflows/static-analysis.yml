name: static-analysis
on:
  push:
    branches: [main]

env:
  PROJECT_PATH: commet

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout  ┏━┓ ︵ /(^.^/)
        uses: actions/checkout@v2
        with:
          submodules: 'true'
        
      - name: Setup Flutter  ╰(✿˙ᗜ˙)੭━☆ﾟ.*･｡ﾟ
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Tools  ᕙ|” ◉ ◡ ◉ ”|ᕗ
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libmimalloc-dev

      - name: Configure Flutter (∩｀-´)⊃━☆ﾟ.*･｡ﾟ
        run: flutter config --enable-linux-desktop

      - name: Check Code Style
        run: |
          cd $PROJECT_PATH
          flutter doctor
          # pub clones the git dependencies from GitHub, and a runner that
          # briefly cannot reach it should not fail the check.
          for attempt in 1 2 3; do
            flutter pub get && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "flutter pub get failed (attempt $attempt of 3), retrying in 30 s"
            sleep 30
          done
          rm -r lib/generated
          dart format -o none --show all --set-exit-if-changed .
        
      - name: Code Generation __φ(．．;)
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Check Warnings
        run: |
          cd $PROJECT_PATH
          dart analyze
