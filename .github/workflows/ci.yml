name: ci

# Every push to main: tests and the Windows, Linux and macOS release builds
# start at once (the builds only need the version), and publishing the GitHub
# release waits for all of them. macOS cannot hold the release up — see
# continue-on-error in desktop-build.yml — so a broken macOS leg costs that one
# asset and nothing else. The debug bundles only run when the workflow is
# started by hand with them ticked; attaching the debug bundles waits for the
# release and the debug builds.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. auto reads conventional commits since the last tag.
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      debug:
        description: Also build debug bundles (Windows, Linux and macOS)
        type: boolean
        default: false

# Queue runs instead of overlapping them so two pushes never pick the same version.
concurrency:
  group: ci-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Find tests
        id: find
        run: |
          if find commet/unit_test -name '*_test.dart' 2> /dev/null | grep -q .; then
            echo "dart=true" >> "$GITHUB_OUTPUT"
          fi

          # Only crates that have tests.
          crates=""
          for manifest in rust/*/Cargo.toml; do
            dir=$(dirname "$manifest")
            if grep -rqsE '#\[([a-z_]+::)?test\]' "$dir/src" "$dir/tests"; then
              crates="$crates -p $(sed -nE 's/^name = "(.+)"/\1/p' "$manifest" | head -n1)"
            fi
          done
          echo "rust_crates=$crates" >> "$GITHUB_OUTPUT"

      - name: Verify locked CEF release inputs
        run: |
          python3 tools/cef_runtime.py validate-lock
          python3 -m unittest tools.test_cef_runtime tools.test_cef_host_contract

      - name: Setup Rust
        if: steps.find.outputs.rust_crates != '' || steps.find.outputs.dart == 'true'
        uses: dtolnay/rust-toolchain@stable

      # The soundboard decoder test loads it through dart:ffi.
      - name: Build soundboard decoder
        if: steps.find.outputs.dart == 'true'
        run: cargo build -p audio_decode

      - name: Setup Flutter
        if: steps.find.outputs.dart == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      # The noise suppression tests put a recording through the voice DSP's
      # own library (commet/unit_test/noise_suppression/voice_dsp_fixture.dart);
      # without these they fail rather than skip in CI. The fixture is built
      # with the debug build's dependencies: a release build would compile
      # DeepFilterNet's tract a second time for nothing.
      - name: Build the voice DSP for its tests
        if: steps.find.outputs.dart == 'true'
        run: |
          cargo build -p audio_dsp
          cargo run -q -p audio_dsp --example noisy_speech -- target/voice-fixtures

      # The soundboard playback-end test plays through media_kit's real
      # player on mpv's null audio output
      # (commet/unit_test/soundboard/mediakit_playback_end_test.dart); without
      # libmpv it fails rather than skips in CI.
      - name: Install libmpv
        if: steps.find.outputs.dart == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libmpv2

      - name: Dart unit tests
        if: steps.find.outputs.dart == 'true'
        working-directory: commet
        run: |
          dart run scripts/codegen.dart
          flutter test unit_test

      - name: Rust tests
        if: steps.find.outputs.rust_crates != ''
        run: cargo test ${{ steps.find.outputs.rust_crates }}

  # Noise suppression on its way out of the app, where a merge breaks it
  # without a compile error: the contracts between Rust, Dart, C++ and JS,
  # the web build carrying audio_dsp.wasm, and a noisy recording through the
  # browser's DSP and through the web app's own Dart and vendored LiveKit.
  # The release waits for it. See docs/voice-audio-processing.md, "What the
  # tests guard".
  voice-dsp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Code generation
        working-directory: commet
        run: dart run scripts/codegen.dart

      - name: Noise suppression in the browser
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: tools/voice_dsp/web_loops.sh

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          # Latest plain vX.Y.Z tag. Prerelease and hotfix tags are ignored.
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$last" ]; then
            base=${last#v}
            commits=$(git log --format='%s%n%b' "$last..HEAD")
          else
            base=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' commet/pubspec.yaml)
            commits=$(git log --format='%s%n%b')
          fi

          bump=$BUMP
          if [ "$bump" = auto ]; then
            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<< "$commits"; then
              bump="major"
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$commits"; then
              bump="minor"
            else
              bump="patch"
            fi
          fi

          IFS=. read -r major minor patch <<< "$base"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="v$major.$minor.$patch"

          echo "Last release: ${last:-none, using pubspec $base}. Bump: $bump. Next: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-release:
    needs: [version]
    uses: ./.github/workflows/desktop-build.yml
    with:
      build_mode: release
      version: ${{ needs.version.outputs.version }}
      platforms: '["windows", "linux", "macos"]'

  publish:
    needs: [test, voice-dsp, version, build-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release builds
        uses: actions/download-artifact@v4
        with:
          pattern: roscord-*-release
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          gh release create "$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$VERSION"
          --generate-notes

  build-debug:
    needs: [version]
    if: inputs.debug
    uses: ./.github/workflows/desktop-build.yml
    with:
      build_mode: debug
      version: ${{ needs.version.outputs.version }}
      platforms: '["windows", "linux", "macos"]'

  attach-debug:
    needs: [version, publish, build-debug]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download debug builds
        uses: actions/download-artifact@v4
        with:
          pattern: roscord-*-debug
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
