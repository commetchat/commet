name: desktop-build

# Reusable: builds the desktop bundles for the given platforms in one mode and
# uploads each as an artifact named roscord-<version>-<platform>-<arch>-<mode>.
#
# Also runnable by hand, on any branch, which ci.yml is not: a push to main
# there cuts a release, so it is a costly way to find out whether a platform
# still builds. Dispatching this one just leaves an artifact behind. GitHub
# only lists a workflow_dispatch workflow that exists on the default branch,
# though the run itself can then be pointed at any branch.
on:
  workflow_call:
    inputs:
      build_mode:
        description: release or debug
        required: true
        type: string
      version:
        description: Version tag baked into the build, e.g. v0.5.0
        required: true
        type: string
      platforms:
        description: JSON array of platforms to build, from windows, linux and macos
        required: false
        type: string
        default: '["windows", "linux"]'
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of platforms to build, from windows, linux and macos
        required: false
        type: string
        default: '["macos"]'
      build_mode:
        description: release or debug
        required: false
        type: string
        default: release
      version:
        description: Version tag baked into the build, e.g. v0.5.0
        required: false
        type: string
        default: v0.0.0

jobs:
  build:
    name: ${{ matrix.platform }} (${{ inputs.build_mode }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    # Blacksmith has no macOS image, so that one leg runs on GitHub's.
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2025' || matrix.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    # macOS is the newest target and the least tested, so it does not get to
    # hold up a release: the leg goes red on its own and publish still runs,
    # with whatever it managed to upload. Not when it was asked for by hand,
    # though — that is someone working on the macOS build, and they want to
    # see it fail.
    continue-on-error: ${{ matrix.platform == 'macos' && github.event_name != 'workflow_dispatch' }}
    env:
      # Flutter builds macOS release binaries for both architectures.
      ARCH: ${{ matrix.platform == 'macos' && 'universal' || 'x64' }}
      ASSET_NAME: roscord-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.platform == 'macos' && 'universal' || 'x64' }}-${{ inputs.build_mode }}
      # Release builds get the production application id, debug builds the
      # .develop one so both can be installed side by side.
      COMMET_PROD: ${{ inputs.build_mode == 'release' && '1' || '0' }}
      BUNDLE: ${{ matrix.platform == 'windows' && format('commet/build/windows/x64/runner/{0}', inputs.build_mode == 'debug' && 'Debug' || 'Release') || matrix.platform == 'macos' && format('commet/build/macos/Build/Products/{0}/roscord.app', inputs.build_mode == 'debug' && 'Debug' || 'Release') || format('commet/build/linux/x64/{0}/bundle', inputs.build_mode) }}
      ARCHIVE: ${{ matrix.platform == 'linux' && 'tar.gz' || 'zip' }}
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      # cargokit builds librust_lib_commet with cargo during the Flutter build
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The image still defaults to Xcode 16, but connectivity_plus 7.1 calls
      # NWPath.isUltraConstrained, which only the macOS 26 SDK has (it needs
      # Xcode 26.1.1 or later). This only changes the SDK the app is built
      # against. The deployment target stays at 10.15.
      - name: Select Xcode 26
        if: matrix.platform == 'macos'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # The Blacksmith Windows image ships VS Build Tools without ATL, and
      # flutter_local_notifications_windows needs atlbase.h.
      - name: Install ATL
        if: matrix.platform == 'windows'
        uses: ./.github/actions/install-atl

      # The locked CEF archives (about 360 MB for Windows, 675 MB for Linux)
      # never change for a given lock.  Every tool below still verifies them.
      - name: Cache the locked CEF archive
        if: matrix.platform != 'macos'
        uses: actions/cache@v4
        with:
          path: .cef-cache
          key: cef-archive-${{ matrix.platform }}-${{ hashFiles('third_party/cef/cef.lock.json') }}

      - name: Stage locked CEF host SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE ".cef-cache"
          $sdk = Join-Path $env:GITHUB_WORKSPACE ".cef-sdk"
          python tools/cef_runtime.py fetch --platform windows-x64 --cache-dir $cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem -LiteralPath $cache -Filter "*.tar.bz2" -File -Recurse | Select-Object -First 1
          if ($null -eq $archive) { throw "locked CEF archive was not fetched" }
          python tools/cef_runtime.py stage-sdk --platform windows-x64 $archive.FullName $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ROSCORD_BUILD_CEF_HOST=ON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CEF_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev libpulse-dev libasound2-dev clang lld cmake pkg-config

      # The Linux host is cef_host (Rust) plus libroscord_cef_engine.so, which
      # is built against the locked SDK.  The runtime is staged flat (every
      # file CEF loads next to libcef.so) and stripped (1.4 GB -> 268 MB).
      - name: Stage locked CEF SDK and runtime
        if: matrix.platform == 'linux'
        run: |
          python3 tools/cef_runtime.py fetch --platform linux-x64 --cache-dir .cef-cache > /dev/null
          archive=$(find .cef-cache -type f -name '*_linux64.tar.bz2' | head -n 1)
          if [ -z "$archive" ]; then echo "locked CEF archive was not fetched" >&2; exit 1; fi
          python3 tools/cef_runtime.py stage-sdk --platform linux-x64 "$archive" .cef-sdk > /dev/null
          python3 tools/cef_runtime.py stage --platform linux-x64 --strip "$archive" .cef-runtime > /dev/null
          {
            echo "ROSCORD_BUILD_CEF_HOST=ON"
            echo "ROSCORD_CEF_SDK_ROOT=$GITHUB_WORKSPACE/.cef-sdk"
            echo "ROSCORD_CEF_RUNTIME_DIR=$GITHUB_WORKSPACE/.cef-runtime"
          } >> "$GITHUB_ENV"

      - name: Code generation
        working-directory: commet
        run: dart run scripts/codegen.dart

      - name: Build
        working-directory: commet
        run: >-
          dart run scripts/build_release.dart
          --platform ${{ matrix.platform }}
          --build_mode ${{ inputs.build_mode }}
          --version_tag ${{ inputs.version }}
          --git_hash ${{ github.sha }}
          --build_detail ${{ matrix.platform }}-${{ env.ARCH }}

      # Runs the bundled host for real: opens a page, types into it, reads
      # its frames from the shared-memory ring, closes it, and checks the host
      # exits.  On Windows the '@' goes in as AltGr does (Ctrl+Alt).
      - name: Smoke-test the Linux CEF host
        if: matrix.platform == 'linux'
        run: |
          # Ubuntu 24.04 keeps unprivileged user namespaces, which the CEF
          # sandbox needs, behind AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 tools/cef_host_smoke.py --bundle "$BUNDLE" --seconds 6 --software \
            --type 'roscord@ok' --png cef-smoke-linux.png

      - name: Smoke-test the Windows CEF host
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:ROSCORD_CEF_LOG_FILE = Join-Path $env:GITHUB_WORKSPACE "cef-windows.log"
          python tools/cef_host_smoke.py --bundle $env:BUNDLE --seconds 6 --software `
            --type 'roscord@ok' --png cef-smoke-windows.png
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path $env:ROSCORD_CEF_LOG_FILE)) {
            Write-Output "---- CEF log ----"
            Get-Content $env:ROSCORD_CEF_LOG_FILE -Tail 150
          }
          if ($code -ne 0) { exit $code }

      # Plays a real YouTube embed through the host and keeps the last frame,
      # so every run shows whether the video plays.  YouTube may refuse
      # datacenter addresses, so this cannot fail the build.
      - name: Play a YouTube embed through the CEF host
        if: matrix.platform != 'macos'
        continue-on-error: true
        shell: bash
        run: |
          python=python3
          if [ "${{ matrix.platform }}" = windows ]; then python=python; fi
          "$python" tools/cef_host_smoke.py --bundle "$BUNDLE" --youtube aqz-KE-bpKQ \
            --seconds 15 --software --png "cef-youtube-${{ matrix.platform }}.png"

      - name: Upload the CEF host frames
        if: matrix.platform != 'macos' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-frames-${{ matrix.platform }}
          path: cef-*-${{ matrix.platform }}.png
          if-no-files-found: ignore

      - name: Qualify Windows CEF artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundle = $env:BUNDLE
          $payload = Join-Path $bundle "cef_host"
          $stage = Join-Path $env:GITHUB_WORKSPACE ".cef-stage"
          $metadata = Join-Path $env:GITHUB_WORKSPACE ".cef-metadata"
          $archive = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".cef-cache") -Filter "*.tar.bz2" -File -Recurse | Select-Object -First 1
          if ($null -eq $archive) { throw "locked CEF archive was not cached" }
          python tools/cef_runtime.py stage --platform windows-x64 $archive.FullName $stage --project-root $payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/cef_runtime.py metadata --platform windows-x64 $stage $metadata --project-root $payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/qualify_windows_artifact.py --bundle $bundle --metadata $metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            macos)
              # An .app is a tree of symlinks (every framework's
              # Versions/Current) around an ad-hoc signature, and anything
              # that flattens them leaves an app the Finder refuses to open,
              # so: ditto rather than cp and zip. --keepParent puts
              # roscord.app itself at the root of the archive, which is what
              # someone dragging it to /Applications expects.
              echo "Architectures: $(lipo -archs "$BUNDLE/Contents/MacOS/roscord")"
              ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" "dist/$ASSET_NAME.zip"
              ;;
            windows)
              cp -r "$BUNDLE" "dist/$ASSET_NAME"
              (cd dist && 7z a -tzip "$ASSET_NAME.zip" "$ASSET_NAME" > /dev/null)
              ;;
            *)
              cp -r "$BUNDLE" "dist/$ASSET_NAME"
              (cd dist && tar -czf "$ASSET_NAME.tar.gz" "$ASSET_NAME")
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}.${{ env.ARCHIVE }}
          if-no-files-found: error
